<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101323">
  <title>Contact — A Little Spark</title>
  <style>
    :root { color-scheme:dark; --ink:#f7f5ff; --muted:#b4b4ca; --line:rgba(255,255,255,.14); --mint:#83f0d2; }
    * { box-sizing:border-box; }
    body { min-height:100svh; margin:0; display:grid; place-items:center; padding:1.5rem; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 18% 15%,rgba(117,82,207,.34),transparent 38%),radial-gradient(ellipse at 82% 82%,rgba(36,177,159,.2),transparent 35%),linear-gradient(145deg,#101323 5%,#17182c 55%,#101b27); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:radial-gradient(rgba(255,255,255,.58) .7px,transparent .7px); background-size:30px 30px; }
    main { position:relative; width:min(760px,100%); padding:clamp(2rem,7vw,4.5rem); border:1px solid var(--line); border-radius:28px; background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035)); box-shadow:0 30px 100px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.12); backdrop-filter:blur(18px); animation:rise .7s ease both; }
    nav { display:flex; justify-content:flex-end; gap:1.2rem; margin-bottom:3.5rem; }
    nav a { color:#c7c4dc; font-size:.9rem; text-decoration:none; } nav a:hover,nav a[aria-current="page"] { color:var(--mint); }
    .eyebrow { color:var(--mint); font-size:.76rem; font-weight:750; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:.8rem 0 1.2rem; font-size:clamp(3rem,9vw,5.5rem); line-height:1; letter-spacing:-.07em; }
    h1 span { color:transparent; background:linear-gradient(100deg,#c1aaff,#f1d5ff 48%,#83f0d2); background-clip:text; -webkit-background-clip:text; }
    p { max-width:610px; color:var(--muted); font-size:1.08rem; line-height:1.8; }
    .contact-card { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-top:2rem; padding:1.25rem 1.4rem; border:1px solid rgba(255,255,255,.1); border-radius:16px; background:rgba(255,255,255,.045); }
    .contact-card span { color:#dedced; }
    .contact-card a { color:#17152a; padding:.75rem 1rem; border-radius:11px; background:linear-gradient(110deg,#c9b3ff,#a8f1dc); font-weight:750; text-decoration:none; transition:transform .2s ease; }
    .contact-card a:hover { transform:translateY(-2px); }
    a:focus-visible { outline:3px solid white; outline-offset:4px; }
    footer { margin-top:3rem; color:#85869e; font-size:.8rem; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="Hello%20World.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <div class="eyebrow">Say hello</div>
    <h1>Let’s <span>connect.</span></h1>
    <p>Have a thought, a question, or an idea for what should come next? I’d love to hear from you.</p>
    <div class="contact-card"><span>Start a conversation</span><a href="mailto:hello@example.com">Email me ↗</a></div>
    <footer>Replace hello@example.com with your preferred email address.</footer>
  </main>
</body>
</html>
