<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101323">
  <title>Hello, World — A Little Spark</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #b4b4ca;
      --glass: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .14);
      --violet: #b59cff;
      --mint: #83f0d2;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101323;
      background-image:
        radial-gradient(ellipse at 18% 15%, rgba(117, 82, 207, .34), transparent 38%),
        radial-gradient(ellipse at 82% 82%, rgba(36, 177, 159, .2), transparent 35%),
        linear-gradient(145deg, #101323 5%, #17182c 55%, #101b27);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(rgba(255,255,255,.58) .7px, transparent .7px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    .orb {
      position: fixed;
      width: 26rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .16;
      background: var(--violet);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb.one { top: -17rem; left: -9rem; }
    .orb.two { right: -17rem; bottom: -18rem; background: var(--mint); animation-delay: -5s; }
    main {
      position: relative;
      width: min(680px, calc(100% - 36px));
      padding: clamp(2rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .48rem .8rem;
      color: #d9d2ff;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      border: 1px solid rgba(181,156,255,.28);
      border-radius: 999px;
      background: rgba(181,156,255,.09);
    }
    .spark { color: var(--mint); font-size: 1rem; }
    h1 {
      margin: 1.55rem 0 1rem;
      font-size: clamp(3.8rem, 12vw, 7.2rem);
      line-height: .95;
      letter-spacing: -.075em;
      font-weight: 780;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #c1aaff 12%, #f1d5ff 48%, #83f0d2 88%);
      background-clip: text;
      -webkit-background-clip: text;
    }
    .intro {
      max-width: 410px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.6vw, 1.12rem);
      line-height: 1.75;
    }
    .rule {
      width: 56px;
      height: 1px;
      margin: 2rem auto 1.5rem;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      min-height: 50px;
      padding: 0 1.2rem;
      color: #17152a;
      font: inherit;
      font-weight: 750;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(110deg, #c9b3ff, #a8f1dc);
      box-shadow: 0 8px 28px rgba(154, 133, 255, .22);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(154, 133, 255, .34); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .arrow { transition: transform .2s ease; }
    button:hover .arrow { transform: translateX(3px); }
    footer { margin-top: 2.4rem; color: #85869e; font-size: .78rem; letter-spacing: .04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(35px, 28px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A tiny beginning</div>
    <h1>Hello,<span>World.</span></h1>
    <p class="intro">A little page, a little glow, and a reminder that every great idea starts somewhere.</p>
    <div class="rule" aria-hidden="true"></div>
    <button type="button" id="hello-button">Say hello <span class="arrow" aria-hidden="true">↗</span></button>
    <footer>Made with curiosity <span aria-hidden="true">·</span> and a little bit of code</footer>
  </main>
  <script>
    document.getElementById('hello-button').addEventListener('click', () => {
      const button = document.getElementById('hello-button');
      button.innerHTML = 'Hello right back <span class="arrow" aria-hidden="true">✦</span>';
      button.setAttribute('aria-label', 'Hello right back');
    });
  </script>
</body>
</html>
